<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogFix AI V2 · Offline UI</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#081424;color:#e6f2ff}*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh}aside{width:240px;background:#101e33;border-right:1px solid #29405d;padding:24px 14px;position:sticky;top:0;height:100vh}aside h1{margin:0 10px 24px;font-size:23px}aside h1 span{color:#51b7ff}aside button{display:block;margin:5px 0;width:100%;text-align:left;border:0;border-radius:9px;background:none;color:#a9bfdc;padding:12px;cursor:pointer}aside button.active,aside button:hover{background:#1d3552;color:white}main{flex:1;min-width:0;padding:30px;max-width:1450px}.banner{font-size:12px;color:#9fb6d4;letter-spacing:1px}.title{margin:8px 0 5px;font-size:29px}p{color:#9bb0cb;line-height:1.55}.row,.cols{display:flex;gap:14px;flex-wrap:wrap}.cols>.card{flex:1 1 360px}.card{padding:20px;border:1px solid #2b4464;background:#14263e;border-radius:13px;margin:14px 0}.metric{flex:1 1 130px}.metric strong{font-size:30px;display:block}.metric small,.note{color:#9fb8d6}.pill{display:inline-block;border-radius:30px;background:#274f64;color:#8eecd8;padding:5px 10px;font-size:11px}.danger{color:#ffc0bd}.warn{color:#ffce83}button.action{padding:11px 16px;border:none;border-radius:9px;background:#3182c8;color:#fff;cursor:pointer;font-weight:700;margin:6px 6px 6px 0}button.secondary{background:#244463}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{padding:11px;background:#091a2e;color:#e4eef8;border:1px solid #36516f;border-radius:7px;min-width:0;max-width:100%;font:inherit}input[type=checkbox]{accent-color:#32a6ed}label{display:block;margin:12px 0;font-size:12px;color:#b4c7e0}label input:not([type=checkbox]),label select,label textarea{display:block;width:100%;margin-top:6px}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #2a4260;padding:12px;text-align:left;max-width:600px;overflow-wrap:anywhere}th{color:#93acc9}.agent{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #2d4768;padding:12px 0;font-size:12px}.agent small{color:#93aac5}.status{color:#80dbab}.status.running{color:#85cfff}.status.failed{color:#fdb0b0}.alert{padding:12px 14px;border:1px solid #875f55;border-radius:8px;background:#482a32;color:#ffc2b8;margin:14px 0}#toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:#244866;padding:14px;border-radius:9px;display:none;z-index:10}code{font-family:monospace;color:#9fc9ff}button.nav{font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}.control{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.control>label{flex:1;min-width:180px}.archive button{background:#122238;color:#dceaff;border:0;border-bottom:1px solid #34516e;padding:12px;text-align:left;width:100%;cursor:pointer}.archive button:hover{background:#25425d}@media(max-width:800px){body{display:block}aside{height:auto;position:static;width:100%;padding:10px}aside button{width:auto;display:inline-block;padding:7px}aside h1{font-size:18px;margin:5px}main{padding:14px}}
